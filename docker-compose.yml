services:
  app:
    image: golang:1.26.5
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: tail -f /dev/null
    depends_on:
      - nats
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
  nats:
    image: nats@sha256:026a66a4497c6d7d3eed741781770099c48c755bf3a55b6950d76dd210596eb3
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-lab-data:/data
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]

  nats-tools:
    image: natsio/nats-box:0.19.6
    depends_on:
      nats:
        condition: service_started
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}

volumes:
  nats-lab-data:
    name: nats-lab-data
